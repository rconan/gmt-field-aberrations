[package]
name = "gmt-field-aberrations"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["delrays","gmt-full-field-display", "gmt-point-field-display"]

[workspace.dependencies]
env_logger = "0.11.10"
skyangle = { version = "0.4.0", features = ["serde"] }
color-eyre = "0.6.5"
triangle-rs = "0.1.2"
serde-pickle = "1.2.0"
rayon = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
crseo = "2.5.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"

[dependencies]
crseo.workspace = true
env_logger.workspace = true
log = "0.4.32"
rson = "0.1.0"
serde.workspace = true
serde-pickle.workspace = true
skyangle.workspace = true
zernike = "0.2.2"
color-eyre.workspace = true
ron = "0.12.1"
rayon.workspace = true
anyhow.workspace = true
faer = "0.24.0"
geotrans = "1.2.0"
thiserror.workspace = true

[dev-dependencies]
triangle-rs.workspace = true
